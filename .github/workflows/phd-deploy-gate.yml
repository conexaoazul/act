name: PHD deploy gate

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Imagem GHCR candidata do PHD"
        required: true
        type: string

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate BlueOps scripts
        run: |
          bash -n scripts/odoo-blueops.sh
          bash -n scripts/phd-deploy.sh
          bash -n scripts/phd-healthcheck.sh
          bash -n scripts/install-odoo-blueops.sh
          bash -n scripts/phd-ci.sh
          bash -n scripts/blue-ci-presets.sh
      - name: Validate image namespace
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          case "$IMAGE" in
            ghcr.io/conexaoazul/odoo-demo-phd:*) ;;
            *) echo "Imagem fora do namespace permitido"; exit 2 ;;
          esac
      - name: Operational commands
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          echo "No azul2:"
          echo "phd-deploy --image $IMAGE"
          echo "Após GATE_OK:"
          echo "phd-deploy --image $IMAGE --apply"
